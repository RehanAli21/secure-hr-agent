# Settings for pytest (the tool that runs our automated tests).
[pytest]
# Look for tests in the tests folder.
testpaths = tests
# Let the tests do "from app.main import app", just like the server does.
pythonpath = .
# Hide one warning that comes from inside the Starlette library (not from our code).
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
