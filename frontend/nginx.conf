# nginx in Docker does what Vite's dev server does while developing (see vite.config.ts):
# it serves the page, and forwards /api/... to the agent service without the "/api" part.
# To the browser everything comes from ONE address, so the login cookie works with no CORS.

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # The slash at the end of the address removes "/api": /api/chat -> http://agent:8001/chat
        proxy_pass http://agent:8001/;
        # One chat message may take minutes (the agent stops it after 5): don't give up before that.
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
