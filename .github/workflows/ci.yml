# CI: GitHub runs this on its own computers, so a change that breaks something is caught even if
# nobody ran the tests by hand.
#
#   backend, agent, frontend:  on every push and pull request (a few minutes)
#   eval:                      the REAL AI model (Ollama, on a CPU: slow, up to ~1 hour), so only
#                              when you start it by hand (Actions tab -> CI -> "Run workflow"),
#                              and every Monday night. It uses the seed data, never real data.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:       # the "Run workflow" button
  schedule:
    - cron: "0 3 * * 1"    # every Monday at 03:00 UTC

jobs:
  backend:
    # Every push, and the button (so a manual run tests everything); not the weekly run.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:  # a fresh PostgreSQL just for this run
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatekeeper_hr_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Write .env (CI-only values; the database is thrown away after the run)
        # Two database users, like a real install: the tests create gatekeeper_app themselves
        # (create_app_user.py) and run the API as it; postgres is the owner.
        run: |
          echo "DATABASE_URL=postgresql://gatekeeper_app:ci-app-password@127.0.0.1:5432/gatekeeper_hr" > .env
          echo "OWNER_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/gatekeeper_hr" >> .env
          echo "TEST_DATABASE_URL=postgresql://gatekeeper_app:ci-app-password@127.0.0.1:5432/gatekeeper_hr_test" >> .env
          echo "TEST_OWNER_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/gatekeeper_hr_test" >> .env
          echo "JWT_SECRET_KEY=ci-only-secret-0123456789abcdef0123456789abcdef" >> .env
      - name: Tests
        run: python -m pytest -q
      - name: Strict type check
        run: |
          echo '{"include": ["app", "tests", "create_app_user.py", "owner_database.py", "seed.py", "create_user.py", "create_superuser.py", "alembic/env.py"], "typeCheckingMode": "strict"}' > pyrightconfig.json
          npx --yes pyright@1.1.414

  agent:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    env:
      CRUD_API_URL: http://localhost:8000  # required by app/config.py; the tests use a fake one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (no backend and no AI model needed)
        run: python -m pytest -q
      - name: Strict type check
        run: |
          echo '{"include": ["app", "tests", "eval_tool_choice.py"], "typeCheckingMode": "strict"}' > pyrightconfig.json
          npx --yes pyright@1.1.414

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build

  eval:
    # The real model: only by hand or weekly, never on a push (it is slow).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatekeeper_hr
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OLLAMA_MODELS: /home/runner/.ollama/models  # where the model is kept (and cached)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            agent/requirements.txt

      - name: Backend with the seed data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          echo "DATABASE_URL=postgresql://gatekeeper_app:ci-app-password@127.0.0.1:5432/gatekeeper_hr" > .env
          echo "OWNER_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/gatekeeper_hr" >> .env
          echo "JWT_SECRET_KEY=ci-only-secret-0123456789abcdef0123456789abcdef" >> .env
          alembic upgrade head
          python create_app_user.py
          python seed.py
          nohup python -m uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done

      - name: Keep the AI model between runs (it is ~2.5 GB)
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-qwen3-4b-instruct

      - name: Ollama with the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true   # we run our own, so the model goes to OLLAMA_MODELS
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull qwen3:4b-instruct

      - name: Eval (fails if any check fails)
        working-directory: agent
        env:
          CRUD_API_URL: http://127.0.0.1:8000
          OLLAMA_CONTEXT: "8192"
        run: |
          pip install -r requirements.txt
          python eval_tool_choice.py

      - name: Show the logs if something went wrong
        if: failure()
        run: |
          tail -n 50 backend.log || true
          tail -n 50 ollama.log || true
